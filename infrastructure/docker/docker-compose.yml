services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brandforge}
      POSTGRES_USER: ${POSTGRES_USER:-brandforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brandforge} -d ${POSTGRES_DB:-brandforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-brandforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brandforge}
      PORT: 3013
      NODE_ENV: production
    ports:
      - "127.0.0.1:3013:3013"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bf_storage:/app/storage
      - bf_maildir:/app/maildir
    restart: unless-stopped

  # Phase 3: agent run executor (agent_runs table as queue — ADR-0006).
  # Runs by default (no profile): claims pending runs, heartbeats, executes.
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-brandforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brandforge}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bf_storage:/app/storage
    restart: unless-stopped

volumes:
  pgdata:
  bf_storage:
  bf_maildir:
